<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="UnReleased.wav"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>UnReleased.wav — Drive Music</title>
<style>
:root{--bg:#101010;--panel:#191919;--panel2:#222;--text:#f6f6f6;--muted:#a0a0a0;--line:#303030;--accent:#ff3038;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit;background:var(--panel2);border-radius:999px;padding:10px 15px}button:hover{filter:brightness(1.15)}button.primary{background:var(--accent);color:#111;font-weight:700}button.ghost{background:transparent;border:1px solid var(--line)}input{background:#242424;color:white;border:1px solid #383838;border-radius:12px;padding:12px;min-width:0;width:100%}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;padding-bottom:100px}.sidebar{border-right:1px solid var(--line);padding:25px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:24px;font-weight:850;letter-spacing:-1.5px;padding:0 10px 26px}.brand span{color:var(--accent)}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;border-radius:10px;color:#bdbdbd}.nav button.active{background:#292929;color:white}.nav button b{display:inline-block;width:27px;color:var(--accent)}.side-label{font-size:11px;color:#777;letter-spacing:1.5px;font-weight:700;margin:28px 10px 10px}.drive-status{background:#1b1b1b;border:1px solid var(--line);padding:13px;border-radius:14px;margin-top:25px;font-size:12px;color:var(--muted)}.drive-status strong{display:block;color:white;margin-bottom:5px}
main{padding:34px clamp(18px,4vw,58px);max-width:1500px;width:100%;margin:0 auto}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:28px}.eyebrow{font-size:11px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-weight:800}.title{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.05;margin:7px 0 8px}.sub{color:var(--muted);max-width:600px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{background:linear-gradient(125deg,#351719,#171717 60%);border:1px solid #4a2628;border-radius:24px;padding:clamp(22px,4vw,42px);display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:32px;min-height:205px}.hero h2{font-size:clamp(25px,3vw,37px);letter-spacing:-1.3px;margin:9px 0}.hero p{color:#c0c2b6;margin:0}.hero-mark{font-size:76px;line-height:1;color:var(--accent);font-weight:900;letter-spacing:-8px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 14px}.section-head h2{margin:0;font-size:21px;letter-spacing:-.5px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{background:var(--panel);padding:12px;border:1px solid #262626;border-radius:16px;min-width:0;cursor:pointer}.cover{aspect-ratio:1;background:linear-gradient(145deg,#343434,#1c1c1c);border-radius:11px;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--accent);margin-bottom:12px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.card-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-sub{color:var(--muted);font-size:12px;margin-top:3px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700}.table td,.table th{padding:12px 10px;border-bottom:1px solid #282828}.table tr:hover td{background:#191919}.track-name{font-weight:650}.track-meta{font-size:12px;color:var(--muted)}.track-actions{display:flex;gap:5px}.track-actions button{padding:7px 10px}.empty{border:1px dashed #3a3a3a;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}.empty strong{display:block;color:white;font-size:17px;margin-bottom:5px}.search{max-width:340px}.hidden{display:none!important}
.player{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,18,.96);backdrop-filter:blur(18px);border-top:1px solid #303030;min-height:82px;padding:12px 22px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(160px,1fr) minmax(180px,1.5fr) minmax(130px,1fr);gap:18px;align-items:center;z-index:10}.now{display:flex;align-items:center;gap:12px;min-width:0}.mini-cover{width:48px;height:48px;flex-shrink:0;border-radius:9px;background:#292929;display:grid;place-items:center;color:var(--accent);font-weight:800}.now-text{min-width:0}.now-text strong,.now-text span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-text span{font-size:12px;color:var(--muted)}.controls{text-align:center}.control-buttons{display:flex;align-items:center;justify-content:center;gap:16px}.play{width:38px;height:38px;background:var(--accent);color:#111;font-size:17px;padding:0}.progress{display:flex;align-items:center;gap:8px;color:#888;font-size:10px;margin-top:7px}.progress input{padding:0;height:4px;accent-color:var(--accent);border:0;background:#444}.volume{display:flex;align-items:center;justify-content:flex-end;gap:10px}.volume input{max-width:110px;padding:0;height:4px;accent-color:var(--accent);border:0}.modal-backdrop{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(500px,100%);background:#1a1a1a;border:1px solid #393939;border-radius:20px;padding:24px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 8px}.field{margin:16px 0}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:7px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{padding:12px 14px;border-radius:12px;background:#252a19;color:#dfff76;font-size:13px;margin:14px 0}.danger{color:#ff9999}.cover-editor{display:flex;align-items:center;gap:12px}.cover-preview{width:76px;height:76px;object-fit:cover;border-radius:12px;background:#292929}.draggable{cursor:grab}.draggable.dragging{opacity:.4}.drop-hint{color:#ff6268;font-size:11px}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:500px){.meta-grid{grid-template-columns:1fr}}.pill{font-size:11px;border:1px solid #444;padding:3px 8px;border-radius:999px;color:#aaa}.folder-picker{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#141414}.folder-tree{max-height:310px;overflow:auto;padding:6px}.folder-row{display:flex;align-items:center;gap:9px;width:100%;border-radius:9px;text-align:left;background:transparent;padding:9px 10px;border:1px solid transparent;min-width:0}.folder-row.selected{background:#32191b;border-color:#793036}.folder-row:hover{background:#242424}.folder-row .folder-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.folder-row .folder-path{font-size:10px;color:#888;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-branch{color:#686868;font-family:monospace;white-space:pre}.folder-empty{padding:18px;text-align:center;color:#999;font-size:13px}.folder-picker-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #303030;font-size:12px;color:#aaa}.folder-picker-head strong{color:#fff}.folder-search{margin-bottom:8px}.player-extra{display:flex;gap:5px;align-items:center}.player-extra button{padding:7px 9px;font-size:12px}.player-extra button.active{border-color:var(--accent);color:var(--accent);background:#32191b}.queue-row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #303030}.queue-row .queue-info{flex:1;min-width:0}.queue-row .queue-info strong,.queue-row .queue-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.queue-row.current{background:#2b1719;border-radius:10px}.queue-row.current strong{color:var(--accent)}
@media(max-width:800px){.app{display:block;padding-bottom:155px}.sidebar{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:13px 15px}.brand{padding:3px 5px 12px;font-size:21px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 12px}.nav button b{width:auto;margin-right:5px}.side-label,.drive-status{display:none}main{padding:24px 16px}.topline{align-items:flex-start;flex-direction:column}.hero{min-height:170px}.hero-mark{font-size:48px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.player{grid-template-columns:1fr auto;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.now{grid-column:1}.controls{grid-column:1/3;grid-row:2}.volume{grid-column:2;grid-row:1}.volume label,.volume input{display:none}.mini-cover{width:40px;height:40px}.table th:nth-child(3),.table td:nth-child(3){display:none}.hide-mobile{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">UnReleased<span>.wav</span></div>
  <nav class="nav" id="nav">
    <button data-view="home" class="active"><b>⌂</b> Home</button>
    <button data-view="library"><b>▤</b> Library</button>
    <button data-view="playlists"><b>☷</b> Playlists</button>
    <button data-view="albums"><b>▦</b> Albums</button>
    <button data-view="folders"><b>▣</b> Folder playlists</button>
  </nav>
  <div class="side-label">YOUR SPACE</div>
  <button class="ghost" style="width:100%" onclick="openCreate('playlist')">＋ New playlist</button>
  <div class="drive-status"><strong>Google Drive</strong><span id="driveStatus">Not connected</span><div style="margin-top:10px"><button class="primary" onclick="openSettings()" style="width:100%">Connect Drive</button><button class="ghost" onclick="manualSync()" style="width:100%;margin-top:7px">↻ Sync library</button></div></div>
</aside>
<main>
  <div class="topline"><div><div class="eyebrow">Your music, your world</div><h1 class="title" id="pageTitle">Listen differently.</h1><div class="sub" id="pageSub">Your Drive collection, synced across your devices.</div></div><div class="actions"><button class="ghost" onclick="installPwa()">＋ Install</button><button class="ghost" onclick="openSettings()">⚙ Settings</button><button class="primary" onclick="openCreate('playlist')">＋ Create</button></div></div>
  <div id="content"></div>
</main>
</div>
<footer class="player">
  <div class="now"><div class="mini-cover" id="miniCover">♪</div><div class="now-text"><strong id="nowTitle">Nothing playing</strong><span id="nowArtist">Choose a track to begin</span></div></div>
  <div class="controls"><div class="control-buttons"><button class="ghost" title="Previous" onclick="prevTrack()">|◀</button><button class="play" id="playBtn" onclick="togglePlay()">▶</button><button class="ghost" title="Next" onclick="nextTrack()">▶|</button></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" oninput="seekAudio(this.value)"><span id="duration">0:00</span></div></div>
  <div class="volume"><label class="muted">VOL</label><input type="range" min="0" max="1" step=".01" value=".8" oninput="audio.volume=this.value"><div class="player-extra"><button class="ghost" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle playback" aria-label="Shuffle playback">⤨</button><button class="ghost" id="repeatBtn" onclick="cycleRepeat()" title="Repeat: all" aria-label="Repeat mode">↻</button><button class="ghost" onclick="showPlayingList()" title="Playing list" aria-label="Playing list">☷ <span id="queueCount">0</span></button></div></div>
</footer>
<audio id="audio" preload="metadata"></audio>
<div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s);
const DB_KEY='untitled_drive_music_db_v1';
let db=JSON.parse(localStorage.getItem(DB_KEY)||'null')||{playlists:[],albums:[],folderPlaylists:[],tracks:[],settings:{clientId:''}};
let currentView='home',currentTrackIndex=-1,currentTrackId=null,queue=[],shuffle=false,repeatMode='all',tokenClient=null,accessToken=null,tokenExpiry=0;
// Keep a short-lived Google access token in this tab's session only, so a GitHub Pages
// deployment/reload does not immediately force another sign-in. Never cache tokens in the SW.
try {
  const savedAuth = JSON.parse(sessionStorage.getItem('unreleasedwav_google_session') || 'null');
  if (savedAuth && savedAuth.accessToken && savedAuth.expiresAt > Date.now() + 30000) {
    accessToken = savedAuth.accessToken;
    tokenExpiry = savedAuth.expiresAt;
  } else {
    sessionStorage.removeItem('unreleasedwav_google_session');
  }
} catch (e) { console.warn('Could not restore this tab session', e); }
let cloudDbFileId=null, cloudSyncBusy=false, cloudSyncTimer=null;
const CLOUD_DB_NAME='unreleasedwav-library.json';
async function findCloudDb(){
  const q=encodeURIComponent("name='"+CLOUD_DB_NAME+"' and trashed=false");
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=appDataFolder&pageSize=10&fields=files(id,name,modifiedTime)');
  const d=await r.json(); return d.files?.[0]||null;
}
async function loadCloudDb(){
  const file=await findCloudDb();
  if(!file){cloudDbFileId=null;return false}
  const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media');
  const remote=await r.json();
  if(remote && Array.isArray(remote.playlists) && Array.isArray(remote.albums) && Array.isArray(remote.folderPlaylists) && Array.isArray(remote.tracks)){
    const localTracks=new Map((db.tracks||[]).map(t=>[t.id,t]));
    remote.tracks=remote.tracks.map(t=>({...localTracks.get(t.id),...t}));
    db={...remote,settings:{...(remote.settings||{}),clientId:db.settings?.clientId||remote.settings?.clientId||''}};
    cloudDbFileId=file.id; save(); return true;
  }
  return false;
}
async function saveCloudDb(){
  if(!accessToken || Date.now()>tokenExpiry-30000 || cloudSyncBusy)return;
  cloudSyncBusy=true;
  try{
    const payload=JSON.stringify({...db,cloudUpdatedAt:new Date().toISOString()});
    if(!cloudDbFileId){const found=await findCloudDb();cloudDbFileId=found?.id||null}
    if(cloudDbFileId){
      await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(cloudDbFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:payload});
    }else{
      const metadata={name:CLOUD_DB_NAME,mimeType:'application/json',parents:['appDataFolder']};
      const boundary='unreleasedwav_boundary';
      const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+payload+'\r\n--'+boundary+'--';
      const r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
      const created=await r.json();cloudDbFileId=created.id;
    }
    $('#driveStatus').textContent='Connected · synced';
  }catch(e){console.warn('Cloud sync failed',e);$('#driveStatus').textContent='Connected · sync issue'}
  finally{cloudSyncBusy=false}
}
function scheduleCloudSync(){save();if(!accessToken)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(saveCloudDb,700)}

const audio=$('#audio');
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function duration(n){if(!Number.isFinite(n))return '0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
function setView(v){currentView=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-view]');if(b)setView(b.dataset.view)});

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
async function installPwa(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}alert('On iPhone: open this app in Safari, tap Share, then “Add to Home Screen”. On desktop, use the browser install icon or menu. HTTPS hosting is required.');}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',async()=>{
  try {
    const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    // Check for a new deployment without clearing localStorage/sessionStorage or the app shell cache.
    registration.update().catch(()=>{});
  } catch(e) { console.warn('PWA offline setup failed',e); }
});
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function setCoverPreview(inputId,previewId){const file=document.getElementById(inputId)?.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Choose an image file.');return}if(file.size>2*1024*1024){alert('Please use cover art under 2 MB.');return}fileToDataUrl(file).then(src=>{const p=document.getElementById(previewId);p.src=src;p.dataset.newCover=src})}
function saveCollectionDetails(kind,id){const arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;const x=arr.find(v=>v.id===id);if(!x)return;x.name=document.getElementById('editName').value.trim()||x.name;x.description=document.getElementById('editDescription').value.trim();x.artist=document.getElementById('editArtist').value.trim();x.year=document.getElementById('editYear').value.trim();const cover=document.getElementById('coverPreview').dataset.newCover;if(cover)x.cover=cover;scheduleCloudSync();closeModal();render()}
function moveTrack(kind,id,from,to){const arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;const x=arr.find(v=>v.id===id);if(!x)return;const [item]=x.trackIds.splice(from,1);x.trackIds.splice(to,0,item);scheduleCloudSync();editCollection(kind,id)}
function render(){let title={home:'Listen differently.',library:'Your library',playlists:'Playlists',albums:'Albums',folders:'Folder playlists'};$('#pageTitle').textContent=title[currentView]||'Your music';$('#pageSub').textContent={home:'Your music, synced across your devices with Google Drive.',library:'Every audio file you have added from Drive.',playlists:'Make a playlist for every mood, moment, or idea.',albums:'Curated collections with their own artwork and identity.',folders:'Turn a Drive folder into a playlist that stays in sync.'}[currentView]||'';
let c=$('#content');
if(currentView==='home'){c.innerHTML=`<section class="hero"><div><div class="eyebrow">YOUR COLLECTION</div><h2>Everything you love.<br>In one place.</h2><p>Music from Drive. Playlists made by you.</p><div class="actions" style="margin-top:20px"><button class="primary" onclick="openSettings()">Connect Google Drive ↗</button><button class="ghost" onclick="setView('library')">Browse library</button></div></div><div class="hero-mark">♪</div></section><div class="section-head"><h2>Recently added</h2><button class="ghost" onclick="setView('library')">View all</button></div>${trackTable(db.tracks.slice(-5).reverse())}<div class="section-head"><h2>Made by you</h2><button class="ghost" onclick="openCreate('playlist')">＋ Create</button></div>${collectionCards([...db.playlists.map(x=>({...x,kind:'playlist'})),...db.albums.map(x=>({...x,kind:'album'}))].slice(0,6))}`}
else if(currentView==='library'){c.innerHTML=`<div class="section-head"><h2>All tracks <span class="pill">${db.tracks.length}</span></h2><div class="search"><input id="trackSearch" placeholder="Search your music…" oninput="filterTracks(this.value)"></div></div><div id="trackResults">${trackTable(db.tracks)}</div><div class="actions" style="margin-top:20px"><button class="primary" onclick="openSettings()">＋ Import from Google Drive</button><button class="ghost" onclick="addDemoHint()">How to import</button></div>`}
else if(currentView==='playlists')c.innerHTML=`<div class="section-head"><h2>Your playlists</h2><button class="primary" onclick="openCreate('playlist')">＋ New playlist</button></div>${collectionCards(db.playlists.map(x=>({...x,kind:'playlist'})))}`;
else if(currentView==='albums')c.innerHTML=`<div class="section-head"><h2>Your albums</h2><button class="primary" onclick="openCreate('album')">＋ Create album</button></div><p class="muted">Create an album from a regular playlist or a folder playlist.</p>${collectionCards(db.albums.map(x=>({...x,kind:'album'})))}`;
else if(currentView==='folders')c.innerHTML=`<div class="section-head"><h2>Folder playlists</h2><button class="primary" onclick="openCreate('folder')">＋ Pack a folder</button></div><p class="muted">A Drive folder becomes a playlist. Refresh it any time to sync new audio files.</p>${collectionCards(db.folderPlaylists.map(x=>({...x,kind:'folder'})))}`;
}
function collectionCards(items){if(!items.length)return `<div class="empty"><strong>Nothing here yet</strong>Create a playlist, pack a Drive folder, or build an album from a playlist.<div style="margin-top:15px"><button class="primary" onclick="openCreate('${currentView==='albums'?'album':currentView==='folders'?'folder':'playlist'}')">Get started</button></div></div>`;return `<div class="cards">${items.map(x=>`<article class="card" onclick="openCollection('${x.kind}','${x.id}')"><div class="cover">${x.cover?`<img src="${escapeHtml(x.cover)}">`:(x.kind==='album'?'▦':x.kind==='folder'?'▣':'♫')}</div><div class="card-title">${escapeHtml(x.name)}</div><div class="card-sub">${(x.trackIds||[]).length} tracks · ${x.kind==='folder'?'Folder playlist':x.kind==='album'?'Album':'Playlist'}</div></article>`).join('')}</div>`}
function trackTable(tracks,collectionKind=null,collectionId=null){if(!tracks.length)return `<div class="empty"><strong>Your music will live here</strong>Connect Google Drive and import audio files to start listening.</div>`;return `<table class="table"><thead><tr><th>Track</th><th>Source</th><th class="hide-mobile">Duration</th><th></th></tr></thead><tbody>${tracks.map(t=>`<tr><td><div class="track-name">${escapeHtml(t.name)}</div><div class="track-meta">${escapeHtml([t.artist,t.album].filter(Boolean).join(' · ')||'Unknown artist')}</div></td><td><span class="pill">${escapeHtml(t.source||'Drive')}</span></td><td class="hide-mobile track-meta">${t.duration?duration(t.duration):'—'}</td><td><div class="track-actions"><button onclick="event.stopPropagation();${collectionKind&&collectionId?`playTrackFromCollection('${collectionKind}','${collectionId}','${t.id}')`:`playTrack('${t.id}')`}" title="Play">▶</button><button onclick="event.stopPropagation();playNext('${t.id}',${collectionKind&&collectionId?`'${collectionKind}','${collectionId}'`:`null,null`})" title="Play next">⤴</button><button onclick="event.stopPropagation();addToPlayingList('${t.id}',${collectionKind&&collectionId?`'${collectionKind}','${collectionId}'`:`null,null`})" title="Add to playing list">☷＋</button><button onclick="event.stopPropagation();addTrackToPlaylist('${t.id}')" title="Add to playlist">＋</button><button onclick="event.stopPropagation();editTrackMetadata('${t.id}')" title="Edit metadata">⋯</button></div></td></tr>`).join('')}</tbody></table>`}

function persistGoogleSession(){
  try {
    if(accessToken && tokenExpiry > Date.now() + 30000) sessionStorage.setItem('unreleasedwav_google_session', JSON.stringify({accessToken, expiresAt:tokenExpiry}));
    else sessionStorage.removeItem('unreleasedwav_google_session');
  } catch(e) { console.warn('Could not save temporary Google session', e); }
}

function connectGoogle(){

    if(r.error){console.warn('Google authorization failed',r);$('#driveStatus').textContent='Reconnect Google Drive';return}
    accessToken=r.access_token;tokenExpiry=Date.now()+(r.expires_in||3600)*1000;persistGoogleSession();await finishGoogleConnect();
  }});
  // Do not force the consent screen on every deployment. Google may still require a user gesture/account chooser.
  tokenClient.requestAccessToken({prompt:''});
}
async function driveFetch(url,opts={}){
  if(!accessToken||Date.now()>tokenExpiry-30000){accessToken=null;tokenExpiry=0;persistGoogleSession();$('#driveStatus').textContent='Reconnect Google Drive';throw Error('Google session expired. Select Connect Drive to continue.')}
  let r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+accessToken,...(opts.headers||{})}});
  if(r.status===401){accessToken=null;tokenExpiry=0;persistGoogleSession();$('#driveStatus').textContent='Reconnect Google Drive';throw Error('Google session expired. Select Connect Drive to continue.')}
  if(!r.ok)throw Error('Google Drive error '+r.status);return r
}
const AUDIO_EXTENSIONS=new Set(['mp3','wav','wave','m4a','aac','ogg','oga','opus','flac','wma','aiff','aif','webm','mp4','amr','3gp']);
function fileExtension(name=''){const m=String(name).toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:''}
function isAudioCandidate(f){const ext=fileExtension(f.name);return (f.mimeType||'').toLowerCase().startsWith('audio/')||AUDIO_EXTENSIONS.has(ext)}
function normalizedAudioMime(f){const ext=fileExtension(f.name);if(ext==='mp3')return 'audio/mpeg';if(ext==='wav'||ext==='wave')return 'audio/wav';if(ext==='m4a')return 'audio/mp4';if(ext==='aac')return 'audio/aac';if(ext==='ogg'||ext==='oga')return 'audio/ogg';if(ext==='opus')return 'audio/opus';if(ext==='flac')return 'audio/flac';return (f.mimeType||'').toLowerCase().startsWith('audio/')?f.mimeType:'application/octet-stream'}
async function listDriveFiles(query="trashed=false", extra=''){
 // Use Drive's user corpus for a complete My Drive scan. allDrives can return
 // incompleteSearch=true on large drives and silently omit files.
 let all=[],pageToken='',page=0,incomplete=false;
 do{
  const fields='nextPageToken,incompleteSearch,files(id,name,mimeType,modifiedTime,webViewLink,parents,size,description,shortcutDetails,driveId)';
  let url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(query)+'&pageSize=1000&orderBy=name&fields='+encodeURIComponent(fields)+'&supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=user'+(extra?'&'+extra:'')+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
  const r=await driveFetch(url);const d=await r.json();all.push(...(d.files||[]));pageToken=d.nextPageToken||'';page++;incomplete=incomplete||!!d.incompleteSearch;
  $('#driveStatus').textContent=`Reading Drive index · ${all.length} files`;
  // Yield between pages so the UI remains responsive on large accounts.
  await new Promise(resolve=>setTimeout(resolve,0));
 }while(pageToken);
 if(incomplete)console.warn('Google Drive reported an incomplete search; some results may be missing.');
 return all;
}
async function getAudioHeader(f, length=65536){
 const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id)+'?alt=media',{headers:{Range:`bytes=0-${length-1}`}});
 // Some servers/proxies ignore Range and answer 200 with the whole song. Read at most
 // the header bytes and cancel the stream, rather than buffering a multi-GB file.
 if(!r.body?.getReader)return new Uint8Array(0);
 const reader=r.body.getReader(),chunks=[];let total=0;
 try{
  while(total<length){
   const {done,value}=await reader.read();if(done)break;
   const take=value.subarray(0,Math.min(value.length,length-total));
   chunks.push(take);total+=take.length;
   if(take.length<value.length||total>=length){await reader.cancel().catch(()=>{});break}
  }
 }finally{try{reader.releaseLock()}catch{}}
 const out=new Uint8Array(total);let offset=0;for(const chunk of chunks){out.set(chunk,offset);offset+=chunk.length}

}
function parseWavDuration(bytes,fileSize){

  if(id==='fmt '&&size>=12&&start+12<=bytes.length)byteRate=v.getUint32(start+8,true);

}
function parseMp3Duration(bytes,fileSize){

 if(String.fromCharCode(...bytes.slice(0,3))==='ID3'&&bytes.length>=10){const sz=((bytes[6]&127)<<21)|((bytes[7]&127)<<14)|((bytes[8]&127)<<7)|(bytes[9]&127);offset=10+sz+((bytes[5]&0x10)?10:0)}

  if(bytes[i]!==255||(bytes[i+1]&224)!==224)continue;
  const ver=(bytes[i+1]>>3)&3,layer=(bytes[i+1]>>1)&3,bi=(bytes[i+2]>>4)&15,si=(bytes[i+2]>>2)&3;
  if(ver===1||layer!==1||bi===0||bi===15||si===3)continue;
  const bitrate=(ver===3?rates1:rates2)[bi];let sr=sampleBase[si];if(ver===2)sr/=2;if(ver===0)sr/=4;
  const mono=((bytes[i+3]>>6)&3)===3;const side=ver===3?(mono?17:32):(mono?9:17);const x=i+4+side;

}
async function probeDuration(f,oldTrack){
 // Reuse metadata only when the Drive file has not changed.
 if(Number(oldTrack?.duration)>0&&oldTrack.modifiedTime===f.modifiedTime)return Number(oldTrack.duration);
 const ext=fileExtension(f.name);
 try{
  if(['mp3','wav','wave'].includes(ext)){
   const bytes=await getAudioHeader(f,65536);
   const d=(ext==='wav'||ext==='wave')?parseWavDuration(bytes,Number(f.size||0)):parseMp3Duration(bytes,Number(f.size||0));
   if(Number.isFinite(d)&&d>0)return d;
  }
  // Never download entire songs just to inspect duration during a library scan:
  // on libraries with thousands of files this can exhaust memory and crash mobile browsers.
  // Other formats are accepted only when a trustworthy cached duration exists.
  return null;
 }catch(e){console.warn('Could not inspect audio duration:',f.name,e);return null}
}
async function qualifyAudioFiles(files, oldMap, statusLabel='Scanning Drive'){
 const candidates=files.filter(f=>isAudioCandidate(f)&&f.mimeType!=='application/vnd.google-apps.shortcut');
 const accepted=[],stats={scanned:candidates.length,short:0,unknown:0};let done=0;
 // Small bounded batches avoid thousands of queued promises and keep mobile Safari responsive.
 const concurrency=3,batchSize=60;
 for(let start=0;start<candidates.length;start+=batchSize){
  const batch=candidates.slice(start,start+batchSize);let cursor=0;
  async function worker(){
   while(true){
    const i=cursor++;if(i>=batch.length)return;
    const f=batch[i],old=oldMap.get(f.id);let d=await probeDuration(f,old);done++;
    if(d!==null&&d>30){accepted.push({...old,id:f.id,name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,mimeType:normalizedAudioMime(f),driveMimeType:f.mimeType,size:Number(f.size||0),modifiedTime:f.modifiedTime,description:f.description||'',source:'Google Drive',webViewLink:f.webViewLink,parents:f.parents||[],duration:d})}
    else if(d!==null)stats.short++;else stats.unknown++;
    if(done%10===0||done===candidates.length)$('#driveStatus').textContent=`${statusLabel} · ${done}/${candidates.length}`;
   }
  }
  await Promise.all(Array.from({length:Math.min(concurrency,batch.length)},worker));
  // Persist progress between batches, but do not sync the cloud DB 4,600 times.
  save();
  await new Promise(resolve=>setTimeout(resolve,0));
 }
 accepted.sort((a,b)=>a.fileName.localeCompare(b.fileName,undefined,{sensitivity:'base'}));return {accepted,stats};
}
async function importDriveFiles(){

  $('#driveStatus').textContent='Scanning Drive index…';
  const files=await listDriveFiles("trashed=false");
  const old=new Map(db.tracks.map(t=>[t.id,t]));
  const {accepted,stats}=await qualifyAudioFiles(files,old,'Checking audio');
  // Keep the old library entries that could not be re-measured (e.g. FLAC/M4A) if
  // they already have a valid duration and are still present in Drive.
  const acceptedIds=new Set(accepted.map(t=>t.id)),fileById=new Map(files.map(f=>[f.id,f]));
  for(const t of db.tracks){
   const f=fileById.get(t.id);
   if(f&&!acceptedIds.has(t.id)&&Number(t.duration)>30&&t.modifiedTime===f.modifiedTime&&isAudioCandidate(f)){
    accepted.push({...t,parents:f.parents||t.parents||[],webViewLink:f.webViewLink||t.webViewLink});
   }
  }
  db.tracks=accepted;save();$('#driveStatus').textContent=`Connected · ${accepted.length} tracks (>30s)`;render();await saveCloudDb();
  const note=`Scanned ${files.length} Drive files; checked ${stats.scanned} audio candidates.\nImported/retained ${accepted.length} tracks longer than 30 seconds.\nSkipped ${stats.short} tracks that are 30 seconds or shorter.`+(stats.unknown?`\n${stats.unknown} files had unknown duration and were not downloaded in full, to prevent crashes. Existing tracks with saved duration were retained.`:'');
  alert(note);
 }catch(e){console.error('Drive import failed',e);alert('Could not import files: '+e.message);$('#driveStatus').textContent='Connection issue'}
}

let driveFolders=[];let driveFolderById=new Map();
async function loadFolders(){

function folderPath(id,seen=new Set()){

function renderFolderTree(query=''){

}

async function createCollection(kind){let name=$('#collectionName').value.trim();if(!name){alert('Give your collection a name.');return}let item={id:crypto.randomUUID(),name,description:$('#collectionDesc').value.trim(),createdAt:Date.now(),trackIds:[]};if(kind==='playlist')db.playlists.push(item);if(kind==='folder'){let fid=$('#folderId')?.value;if(!fid){alert('Connect Drive and select a folder.');return}let opt=$('#folderId').selectedOptions[0];item.folderId=fid;item.folderName=opt.textContent;item.trackIds=db.tracks.filter(t=>(t.parents||[]).includes(fid)).map(t=>t.id);db.folderPlaylists.push(item)}if(kind==='album'){let type=$('#albumSource').value,id=$('#sourceId').value;let src=(type==='folder'?db.folderPlaylists:db.playlists).find(x=>x.id===id);if(!src){alert('Create a source playlist first.');return}item.sourceType=type;item.sourceId=id;item.trackIds=[...src.trackIds];db.albums.push(item)}scheduleCloudSync();closeModal();setView(kind==='playlist'?'playlists':kind==='folder'?'folders':'albums')}
function openCollection(kind,id){let arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;let x=arr.find(v=>v.id===id);if(!x)return;let tracks=x.trackIds.map(id=>db.tracks.find(t=>t.id===id)).filter(Boolean);openModal(`<div class="eyebrow">${kind==='album'?'ALBUM':kind==='folder'?'FOLDER PLAYLIST':'PLAYLIST'}</div><div class="cover-editor"><div class="cover" style="width:82px;flex:0 0 82px;aspect-ratio:1">${x.cover?`<img src="${x.cover}">`:'♫'}</div><div><h2>${escapeHtml(x.name)}</h2><p class="muted">${escapeHtml(x.description||x.folderName||'')} · ${tracks.length} tracks</p><p class="track-meta">${escapeHtml([x.artist,x.year].filter(Boolean).join(' · '))}</p></div></div><div class="actions"><button class="primary" onclick="playCollection('${kind}','${id}');closeModal()">▶ Play all</button><button class="ghost" onclick="editCollection('${kind}','${id}')">Edit tracks & order</button><button class="ghost" onclick="editCollectionDetails('${kind}','${id}')">Edit details</button>${kind==='folder'?`<button class="ghost" onclick="syncFolder('${id}')">↻ Sync</button>`:''}</div><div style="margin-top:20px">${trackTable(tracks,kind,id)}</div><div class="modal-actions"><button class="ghost danger" onclick="deleteCollection('${kind}','${id}')">Delete</button><button onclick="closeModal()">Close</button></div>`)}
function editCollection(kind,id){let arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;let x=arr.find(v=>v.id===id);const selected=new Set(x.trackIds);const chosen=x.trackIds.map((tid,i)=>{const t=db.tracks.find(v=>v.id===tid);return t?`<div class="draggable" draggable="true" data-index="${i}" style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #303030" ondragstart="dragTrackStart(event)" ondragover="event.preventDefault()" ondrop="dropTrack(event,'${kind}','${id}')"><span class="muted">⠿</span><span style="flex:1">${escapeHtml(t.title||t.name)}<div class="track-meta">${escapeHtml([t.artist,t.album].filter(Boolean).join(' · '))}</div></span><button onclick="removeTrackFromCollection('${kind}','${id}','${tid}')">−</button></div>`:''}).join('');openModal(`<h2>Edit ${escapeHtml(x.name)}</h2><p class="muted">Drag tracks to reorder. Select more tracks below.</p><div id="orderedTracks">${chosen||'<p class="muted">No tracks selected yet.</p>'}</div><div class="drop-hint">Drag ⠿ to change order.</div><div style="max-height:32vh;overflow:auto;margin-top:12px"><div class="side-label">ADD TRACKS</div>${db.tracks.filter(t=>!selected.has(t.id)).map(t=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #303030"><input type="checkbox" style="width:auto" value="${t.id}"><span>${escapeHtml(t.title||t.name)}<div class="track-meta">${escapeHtml([t.artist,t.album].filter(Boolean).join(' · '))}</div></span></label>`).join('')}</div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTrackSelection('${kind}','${id}')">Save order & tracks</button></div>`)}
let draggedTrackIndex=null;function dragTrackStart(e){draggedTrackIndex=Number(e.currentTarget.dataset.index);e.dataTransfer.effectAllowed='move'}function dropTrack(e,kind,id){e.preventDefault();const target=Number(e.currentTarget.dataset.index);if(draggedTrackIndex===null||target===draggedTrackIndex)return;moveTrack(kind,id,draggedTrackIndex,target);draggedTrackIndex=null}function removeTrackFromCollection(kind,id,tid){const arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;const x=arr.find(v=>v.id===id);x.trackIds=x.trackIds.filter(v=>v!==tid);scheduleCloudSync();editCollection(kind,id)}
function editCollectionDetails(kind,id){const arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;const x=arr.find(v=>v.id===id);openModal(`<h2>Edit ${kind==='album'?'album':'collection'}</h2><div class="field"><label>Name</label><input id="editName" value="${escapeHtml(x.name)}"></div><div class="field"><label>Description</label><input id="editDescription" value="${escapeHtml(x.description||'')}"></div><div class="meta-grid"><div class="field"><label>Artist / curator</label><input id="editArtist" value="${escapeHtml(x.artist||'')}" placeholder="Artist name"></div><div class="field"><label>Year</label><input id="editYear" type="number" min="1900" max="2100" value="${escapeHtml(x.year||'')}" placeholder="2026"></div></div><div class="field"><label>Cover image (max 2 MB)</label><input id="coverFile" type="file" accept="image/*" onchange="setCoverPreview('coverFile','coverPreview')"></div><div class="cover-editor"><img id="coverPreview" class="cover-preview" src="${x.cover||''}" alt="Cover preview"><span class="muted">Square artwork looks best.</span></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveCollectionDetails('${kind}','${id}')">Save details</button></div>`)}
function saveTrackSelection(kind,id){let arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;let x=arr.find(v=>v.id===id);const ordered=[...($('#orderedTracks')?.querySelectorAll('[data-index]')||[])].map(el=>x.trackIds[Number(el.dataset.index)]).filter(Boolean);const added=[...$('#modalRoot').querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);x.trackIds=[...ordered,...added];scheduleCloudSync();closeModal();openCollection(kind,id)}
function deleteCollection(kind,id){if(!confirm('Delete this collection? Your Drive files will not be deleted.'))return;let key=kind==='album'?'albums':kind==='folder'?'folderPlaylists':'playlists';db[key]=db[key].filter(x=>x.id!==id);scheduleCloudSync();closeModal();render()}
async function syncFolder(id){let x=db.folderPlaylists.find(v=>v.id===id);try{const files=await listDriveFiles(`'${x.folderId}' in parents and trashed=false`);const old=new Map(db.tracks.map(t=>[t.id,t]));const {accepted,stats}=await qualifyAudioFiles(files,old,'Checking folder');const byId=new Map(accepted.map(t=>[t.id,t]));for(const t of accepted)if(!db.tracks.some(v=>v.id===t.id))db.tracks.push(t);x.trackIds=db.tracks.filter(t=>(t.parents||[]).includes(x.folderId)&&Number(t.duration)>30).map(t=>t.id);scheduleCloudSync();alert(`Folder playlist synced: ${x.trackIds.length} tracks longer than 30 seconds. ${stats.short} short tracks skipped.`);openCollection('folder',id)}catch(e){alert('Sync failed: '+e.message)}}
function getCollectionTracks(kind,id){const arr=kind==='album'?db.albums:kind==='folder'?db.folderPlaylists:db.playlists;const x=arr.find(v=>v.id===id);return x?(x.trackIds||[]).map(tid=>db.tracks.find(t=>t.id===tid)).filter(Boolean):[]}
function updatePlaybackButtons(){const sb=$('#shuffleBtn'),rb=$('#repeatBtn'),qc=$('#queueCount');if(sb){sb.classList.toggle('active',shuffle);sb.title=shuffle?'Shuffle on':'Shuffle off'}if(rb){rb.classList.toggle('active',repeatMode!=='off');rb.textContent=repeatMode==='one'?'↻¹':'↻';rb.title='Repeat: '+(repeatMode==='one'?'one song':repeatMode==='all'?'all playlist':'off')}if(qc)qc.textContent=String(queue.length)}
function shuffledCopy(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function applyShuffleToUpcoming(){if(!shuffle||currentTrackIndex<0)return;const upcoming=queue.slice(currentTrackIndex+1);queue.splice(currentTrackIndex+1,upcoming.length,...shuffledCopy(upcoming));updatePlaybackButtons()}
function playCollection(kind,id){const tracks=getCollectionTracks(kind,id);queue=shuffle?shuffledCopy(tracks):tracks.slice();if(queue.length){currentTrackIndex=0;playTrack(queue[0].id)}updatePlaybackButtons()}
function playTrackFromCollection(kind,id,trackId){const tracks=getCollectionTracks(kind,id);const index=tracks.findIndex(t=>t.id===trackId);if(index<0)return;queue=tracks.slice();if(shuffle){const chosen=queue[index];const rest=shuffledCopy(queue.filter(t=>t.id!==trackId));queue=[chosen,...rest];}currentTrackIndex=0;playTrack(trackId);updatePlaybackButtons()}
function playTrack(id){if(!queue.length||!queue.some(t=>t.id===id))queue=db.tracks.slice();let i=queue.findIndex(t=>t.id===id);if(i<0){queue=db.tracks.slice();i=queue.findIndex(t=>t.id===id)}if(i<0)return;currentTrackIndex=i;let t=queue[i];currentTrackId=t.id;loadAndPlay(t);updatePlaybackButtons()}
function resolveTrackAndContext(id,kind,idOfCollection){if(kind&&idOfCollection){const tracks=getCollectionTracks(kind,idOfCollection);if(tracks.some(t=>t.id===id))return tracks.find(t=>t.id===id)}return db.tracks.find(t=>t.id===id)}
function playNext(id,kind=null,idOfCollection=null){const t=resolveTrackAndContext(id,kind,idOfCollection);if(!t)return;if(!queue.length){queue=[t];currentTrackIndex=0;currentTrackId=t.id;loadAndPlay(t);updatePlaybackButtons();return}queue=queue.filter((x,i)=>!(x.id===id&&i>currentTrackIndex));const insertAt=Math.max(0,currentTrackIndex+1);queue.splice(insertAt,0,t);if(currentTrackIndex<0){currentTrackIndex=0;loadAndPlay(queue[0])}updatePlaybackButtons()}
function addToPlayingList(id,kind=null,idOfCollection=null){const t=resolveTrackAndContext(id,kind,idOfCollection);if(!t)return;if(!queue.length)currentTrackIndex=-1;if(!queue.some((x,i)=>x.id===id&&i>currentTrackIndex))queue.push(t);updatePlaybackButtons()}
function showPlayingList(){const rows=queue.map((t,i)=>`<div class="queue-row ${i===currentTrackIndex?'current':''}"><div class="queue-info"><strong>${i===currentTrackIndex?'▶ ':''}${escapeHtml(t.title||t.name)}</strong><span>${escapeHtml([t.artist,t.album].filter(Boolean).join(' · ')||'Unknown artist')}</span></div><button onclick="playQueuedTrack(${i})" title="Play this track">▶</button><button onclick="removeQueuedTrack(${i})" title="Remove from playing list">×</button></div>`).join('');openModal(`<h2>Playing list <span class="pill">${queue.length} tracks</span></h2><p class="muted">Tracks play in this order. “Play next” inserts after the current song; “Add to playing list” appends to the end.</p><div style="max-height:55vh;overflow:auto">${rows||'<div class="empty">The playing list is empty. Add tracks using ☷＋.</div>'}</div><div class="modal-actions"><button class="ghost" onclick="clearPlayingList()">Clear list</button><button class="primary" onclick="closeModal()">Done</button></div>`)}
function playQueuedTrack(i){if(i<0||i>=queue.length)return;currentTrackIndex=i;loadAndPlay(queue[i]);updatePlaybackButtons();showPlayingList()}
function removeQueuedTrack(i){if(i<0||i>=queue.length)return;const wasCurrent=i===currentTrackIndex;queue.splice(i,1);if(i<currentTrackIndex)currentTrackIndex--;else if(wasCurrent){if(queue.length){currentTrackIndex=Math.min(i,queue.length-1);loadAndPlay(queue[currentTrackIndex])}else{currentTrackIndex=-1;currentTrackId=null;audio.pause();audio.removeAttribute('src');audio.load();$('#nowTitle').textContent='Nothing playing';$('#nowArtist').textContent='Choose a track to begin'}}updatePlaybackButtons();showPlayingList()}
function clearPlayingList(){queue=[];currentTrackIndex=-1;currentTrackId=null;audio.pause();audio.removeAttribute('src');audio.load();$('#nowTitle').textContent='Nothing playing';$('#nowArtist').textContent='Choose a track to begin';updatePlaybackButtons();closeModal()}

function updateMediaSession(t){if(!('mediaSession' in navigator))return;try{const artwork=t?.cover?[{src:t.cover,sizes:'512x512',type:'image/png'}]:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png'}];navigator.mediaSession.metadata=new MediaMetadata({title:t?.title||t?.name||'UnReleased.wav',artist:t?.artist||'UnReleased.wav',album:t?.album||'Your Drive collection',artwork});}catch(e){console.warn('Media metadata unavailable',e)}}
function updateMediaPosition(){if(!('mediaSession' in navigator)||!Number.isFinite(audio.duration)||audio.duration<=0)return;try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate||1,position:Math.min(audio.currentTime,audio.duration)})}catch(e){}}
function setMediaPlaybackState(state){if('mediaSession' in navigator){try{navigator.mediaSession.playbackState=state}catch(e){}}}
async function loadAndPlay(t){
 try{
  if(!accessToken){alert('Connect Google Drive to play your music.');openSettings();return}
  $('#nowTitle').textContent=t.title||t.name;$('#nowArtist').textContent=[t.artist,t.album].filter(Boolean).join(' · ')||'Google Drive';$('#miniCover').innerHTML=t.cover?`<img src="${t.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:9px">`:'♪';$('#playBtn').textContent='…';updateMediaSession(t);setMediaPlaybackState('none');
  if(audio.dataset.objectUrl){URL.revokeObjectURL(audio.dataset.objectUrl);delete audio.dataset.objectUrl}audio.pause();audio.removeAttribute('src');audio.load();
  const mime=normalizedAudioMime({name:t.fileName||t.name,mimeType:t.mimeType});
  if(window.MediaSource&&t.size&&MediaSource.isTypeSupported(mime)){
   const ms=new MediaSource();const url=URL.createObjectURL(ms);audio.dataset.objectUrl=url;audio.src=url;
   await new Promise((resolve,reject)=>{ms.addEventListener('sourceopen',()=>{try{const sb=ms.addSourceBuffer(mime);let offset=0,busy=false,done=false,firstChunkReady=false;const chunk=4*1024*1024;const pump=async()=>{if(busy||done||sb.updating)return;busy=true;try{if(offset>=Number(t.size)){done=true;if(ms.readyState==='open')ms.endOfStream();resolve();return}const end=Math.min(Number(t.size)-1,offset+chunk-1);const r=await driveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(t.id)}?alt=media`,{headers:{Range:`bytes=${offset}-${end}`}});const b=await r.arrayBuffer();if(!b.byteLength)throw Error('Drive returned an empty audio chunk');offset+=b.byteLength;sb.appendBuffer(b)}catch(e){done=true;try{if(ms.readyState==='open')ms.endOfStream('network')}catch{}reject(e)}finally{busy=false}};sb.addEventListener('updateend',()=>{if(!firstChunkReady){firstChunkReady=true;resolve()}if(offset>=Number(t.size)){if(!done){done=true;if(ms.readyState==='open')ms.endOfStream()}}else pump()});pump()}catch(e){reject(e)}},{once:true})});
  }else{const r=await driveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(t.id)}?alt=media`);const rawBlob=await r.blob();const blob=(rawBlob.type&&rawBlob.type!=='application/octet-stream')?rawBlob:new Blob([rawBlob],{type:mime});const url=URL.createObjectURL(blob);audio.dataset.objectUrl=url;audio.src=url}
  await audio.play();$('#playBtn').textContent='Ⅱ';setMediaPlaybackState('playing');
 }catch(e){console.error('Playback failed',e);$('#playBtn').textContent='▶';const msg=e.name==='NotAllowedError'?'The browser blocked playback. Press Play to try again.':e.message||'Unknown playback error';alert('Could not play this track. '+msg+' Reconnect Google Drive if needed.')}
}
function togglePlay(){if(!audio.src){if(db.tracks[0])playTrack(db.tracks[0].id);return}if(audio.paused){audio.play().then(()=>setMediaPlaybackState('playing')).catch(e=>console.warn(e));$('#playBtn').textContent='Ⅱ'}else{audio.pause();$('#playBtn').textContent='▶';setMediaPlaybackState('paused')}}
function nextTrack(){if(!queue.length)queue=db.tracks.slice();if(!queue.length)return;if(currentTrackIndex+1<queue.length){currentTrackIndex++;loadAndPlay(queue[currentTrackIndex]);return}if(repeatMode==='all'){currentTrackIndex=0;loadAndPlay(queue[currentTrackIndex]);return}setMediaPlaybackState('paused');$('#playBtn').textContent='▶'}
function prevTrack(){if(!queue.length)queue=db.tracks.slice();if(!queue.length)return;if(audio.src&&audio.currentTime>3){audio.currentTime=0;audio.play().then(()=>setMediaPlaybackState('playing')).catch(e=>console.warn(e));return}if(currentTrackIndex>0){currentTrackIndex--;loadAndPlay(queue[currentTrackIndex])}else if(repeatMode==='all'){currentTrackIndex=queue.length-1;loadAndPlay(queue[currentTrackIndex])}}
function toggleShuffle(){shuffle=!shuffle;if(shuffle&&queue.length){if(currentTrackIndex>=0)applyShuffleToUpcoming();else queue=shuffledCopy(queue)}updatePlaybackButtons()}
function cycleRepeat(){repeatMode=repeatMode==='all'?'one':repeatMode==='one'?'off':'all';updatePlaybackButtons()}
function seekAudio(v){if(audio.duration)audio.currentTime=audio.duration*Number(v)/100}
audio.addEventListener('timeupdate',()=>{$('#elapsed').textContent=duration(audio.currentTime);$('#duration').textContent=duration(audio.duration);$('#seek').value=audio.duration?audio.currentTime/audio.duration*100:0;updateMediaPosition()});
audio.addEventListener('loadedmetadata',()=>{updateMediaPosition();const t=queue[currentTrackIndex]||db.tracks.find(x=>x.id===currentTrackId);if(t&&Number.isFinite(audio.duration)&&audio.duration>0){t.duration=audio.duration;scheduleCloudSync()}});audio.addEventListener('durationchange',updateMediaPosition);audio.addEventListener('play',()=>{setMediaPlaybackState('playing');$('#playBtn').textContent='Ⅱ'});audio.addEventListener('pause',()=>{setMediaPlaybackState('paused');$('#playBtn').textContent='▶'});
audio.addEventListener('ended',()=>{if(repeatMode==='one'){audio.currentTime=0;audio.play().catch(e=>console.warn(e));return}nextTrack()});audio.addEventListener('error',()=>{if(audio.src)$('#playBtn').textContent='▶'});
if('mediaSession' in navigator){const bindMediaAction=(action,handler)=>{try{navigator.mediaSession.setActionHandler(action,handler)}catch(e){}};bindMediaAction('play',()=>{if(audio.src)audio.play().catch(e=>console.warn(e));else if(db.tracks[0])playTrack(db.tracks[0].id)});bindMediaAction('pause',()=>audio.pause());bindMediaAction('previoustrack',prevTrack);bindMediaAction('nexttrack',nextTrack);bindMediaAction('seekto',details=>{if(Number.isFinite(details.seekTime))audio.currentTime=details.seekTime});bindMediaAction('seekbackward',details=>{audio.currentTime=Math.max(0,audio.currentTime-(details.seekOffset||10))});bindMediaAction('seekforward',details=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+(details.seekOffset||10))})}
function editTrackMetadata(id){const t=db.tracks.find(x=>x.id===id);if(!t)return;openModal(`<h2>Edit track metadata</h2><div class="field"><label>Track title</label><input id="metaTitle" value="${escapeHtml(t.title||t.name)}"></div><div class="field"><label>Artist</label><input id="metaArtist" value="${escapeHtml(t.artist||'')}"></div><div class="field"><label>Album</label><input id="metaAlbum" value="${escapeHtml(t.album||'')}"></div><div class="field"><label>Track number</label><input id="metaTrackNo" type="number" min="1" value="${escapeHtml(t.trackNumber||'')}"></div><div class="field"><label>Year</label><input id="metaYear" type="number" min="1900" max="2100" value="${escapeHtml(t.year||'')}"></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTrackMetadata('${id}')">Save metadata</button></div>`)}function saveTrackMetadata(id){const t=db.tracks.find(x=>x.id===id);if(!t)return;t.title=$('#metaTitle').value.trim()||t.name;t.name=t.title;t.artist=$('#metaArtist').value.trim();t.album=$('#metaAlbum').value.trim();t.trackNumber=$('#metaTrackNo').value;t.year=$('#metaYear').value;scheduleCloudSync();closeModal();render()}
function addTrackToPlaylist(id){if(!db.playlists.length){openCreate('playlist');return}openModal(`<h2>Add to playlist</h2><p class="muted">Choose where this track belongs.</p>${db.playlists.map(p=>`<button style="display:block;width:100%;text-align:left;margin:8px 0" onclick="addTo('${p.id}','${id}')">${escapeHtml(p.name)}</button>`).join('')}<div class="modal-actions"><button onclick="closeModal()">Cancel</button></div>`)}
function addTo(pid,tid){let p=db.playlists.find(x=>x.id===pid);if(p&&!p.trackIds.includes(tid))p.trackIds.push(tid);scheduleCloudSync();closeModal()}
async function manualSync(){if(!accessToken){openSettings();return}$('#driveStatus').textContent='Syncing…';try{await saveCloudDb();await loadCloudDb();await importDriveFiles();await saveCloudDb();render();alert('Library sync complete.')}catch(e){$('#driveStatus').textContent='Sync issue';alert('Sync failed: '+e.message)}}
function addDemoHint(){alert('To import: click Settings → enter your Google OAuth Client ID → sign in → allow Drive access. Audio files are discovered automatically. Collection metadata is stored in Google Drive app data for cross-device sync.')}
render();
// Resume a still-valid temporary token after an in-tab reload/deployment.
if(accessToken && tokenExpiry > Date.now() + 30000 && db.settings.clientId){
  $('#driveStatus').textContent='Restoring session…';
  finishGoogleConnect().catch(e=>{console.warn('Could not restore Drive session',e);$('#driveStatus').textContent='Reconnect Google Drive';});
}
</script>
</body></html>
